name: Watch Trials 31 and 32
on:
  push:
    branches: [main]
    paths: ['.github/workflows/watch-trials31-32.yml']
permissions:
  actions: read
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Capture frozen trial run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for spec in "31:direct-trial31.yml:research/proactive-90pct-crossvenue-v1:proactive-90pct-crossvenue-v1" "32:direct-trial32.yml:research/proactive-alt-basket-crossvenue-v1:proactive-alt-basket-crossvenue-v1"; do
            IFS=: read -r n wf branch exp <<< "$spec"
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            echo "Trial $n run id $id"
            if [ "$id" != 0 ]; then
              gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 10 || true
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs > "/tmp/t${n}-status.json" || true
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --log > "/tmp/t${n}.log" 2>&1 || true
              git fetch origin "$branch"
              git checkout -B "$branch" "origin/$branch"
              mkdir -p "research/crypto/results/${exp}-ops"
              cp "/tmp/t${n}-status.json" "research/crypto/results/${exp}-ops/latest-run-status.json"
              tail -n 800 "/tmp/t${n}.log" > "research/crypto/results/${exp}-ops/latest-run-tail.txt"
              printf '%s\n' "$id" > "research/crypto/results/${exp}-ops/latest-run-id.txt"
              git config user.name theoldtrader-research-bot
              git config user.email actions@users.noreply.github.com
              git add "research/crypto/results/${exp}-ops"
              git commit -m "Ops: capture Trial $n execution status" || true
              git pull --rebase origin "$branch" || true
              git push origin HEAD:"$branch" || true
              git checkout -B main origin/main || git checkout main
            fi
          done
