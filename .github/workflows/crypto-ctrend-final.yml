name: MoneyMog CTREND Trial 4 Final Holdout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-ctrend-v1-final
  cancel-in-progress: false

jobs:
  evaluate-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require observed Trial 4 development and pristine final slot
        shell: bash
        run: |
          set -euo pipefail
          test -f research/crypto/universes/cross-sectional-v1-universe.json
          test -f research/crypto/universes/cross-sectional-v1-formation-sources.json
          test -f research/crypto/results/ctrend-v1-development/summary.json
          test -f research/crypto/results/ctrend-v1-development/provenance.json
          for path in \
            research/crypto/results/ctrend-v1-final/summary.json \
            research/crypto/results/ctrend-v1-final/provenance.json \
            research/crypto/results/ctrend-v1-final/promotion.json; do
            if [ -e "$path" ]; then
              echo "Trial 4 final evidence already exists; refusing overwrite: $path" >&2
              exit 1
            fi
          done

      - name: Validate frozen implementation before first final access
        run: |
          npm ci
          npm test
          python -m py_compile research/crypto/prepare-ctrend-data.py
          python tests/test_prepare_ctrend_data.py

      - name: Acquire checksum-verified full dataset including sealed final holdout
        run: >-
          python research/crypto/prepare-ctrend-data.py
          --mode final
          --confirm-final YES
          --manifest research/crypto/manifests/ctrend-v1.json
          --trial3-manifest research/crypto/manifests/cross-sectional-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --out /tmp/ctrend-v1-final.json.gz
          --sources /tmp/ctrend-v1-final-sources.json

      - name: Verify frozen final boundaries before economics
        run: |
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          start = int(datetime(2026, 1, 1, tzinfo=timezone.utc).timestamp())
          end = int(datetime(2026, 8, 1, tzinfo=timezone.utc).timestamp())
          with gzip.open('/tmp/ctrend-v1-final.json.gz', 'rt', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['experimentId'] == 'ctrend-v1'
          assert data['acquisitionMode'] == 'final'
          assert data['endExclusive'] == '2026-08-01T00:00:00Z'
          final_rows = [row for rows in data['products'].values() for row in rows if start <= row['time'] < end]
          assert final_rows, 'No Trial 4 final-holdout rows were acquired'
          assert all(row['time'] < end for rows in data['products'].values() for row in rows)
          print(f'Trial 4 final acquisition gate passed with {len(final_rows)} member-day rows.')
          PY

      - name: Evaluate Trial 4 final holdout exactly once
        run: >-
          node research/crypto/ctrend-evaluate.js
          --mode final
          --confirm-final YES
          --manifest research/crypto/manifests/ctrend-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --data /tmp/ctrend-v1-final.json.gz
          --out research/crypto/results/ctrend-v1-final/summary.json

      - name: Preserve compact final acquisition provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source_path = Path('/tmp/ctrend-v1-final-sources.json')
          sources = json.loads(source_path.read_text())
          out = Path('research/crypto/results/ctrend-v1-final/provenance.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              'experimentId': 'ctrend-v1',
              'trialNumber': 4,
              'mode': 'final',
              'finalHoldoutStart': '2026-01-01T00:00:00Z',
              'finalHoldoutEndExclusive': '2026-08-01T00:00:00Z',
              'datasetCanonicalJsonSha256': sources['datasetCanonicalJsonSha256'],
              'formationSourceManifestSha256': sources['formationSourceManifestSha256'],
              'universeMembershipSha256': sources['universeMembershipSha256'],
              'sourceArchiveCount': sources['sourceArchiveCount'],
              'sourceManifestSha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Apply frozen Trial 4 promotion criteria without touching live v2
        run: >-
          node research/crypto/ctrend-promotion-check.js
          --manifest research/crypto/manifests/ctrend-v1.json
          --development research/crypto/results/ctrend-v1-development/summary.json
          --final research/crypto/results/ctrend-v1-final/summary.json
          --out research/crypto/results/ctrend-v1-final/promotion.json

      - name: Commit immutable Trial 4 final evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'moneymog-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/crypto/results/ctrend-v1-final/summary.json \
            research/crypto/results/ctrend-v1-final/provenance.json \
            research/crypto/results/ctrend-v1-final/promotion.json
          git commit -m 'Observe ctrend-v1 final holdout'
          git push origin HEAD:research/crypto-oos-v1

      - name: Upload Trial 4 final evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctrend-v1-final
          path: |
            research/crypto/results/ctrend-v1-final/summary.json
            research/crypto/results/ctrend-v1-final/provenance.json
            research/crypto/results/ctrend-v1-final/promotion.json
          if-no-files-found: error
