name: Execute frozen Trial 25 diversified regime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-trial25-diversified-regime.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: trial25-diversified-regime
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/source-qualified-diversified-regime-v1, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight frozen Trial 25
        run: |
          set -euo pipefail
          test ! -e research/crypto/results/source-qualified-diversified-regime-v1-development/summary.json
          test ! -e research/crypto/results/source-qualified-diversified-regime-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/source-qualified-diversified-regime-v1.json'))
          assert m['experimentId']=='source-qualified-diversified-regime-v1' and m['trialNumber']==25 and m['status']=='FROZEN_PRE_DEVELOPMENT'
          assert m['assetSelection']['symbols']==['AVAXUSDT','DOTUSDT','ATOMUSDT','ETCUSDT']
          assert m['assetSelection']['economicValuesUsedForSelection'] is False
          assert m['multipleTesting']['frozenBeforeTrial24EconomicOutputWasObserved'] is True
          assert m['developmentWindow']['economicOutputObservedAtFreeze'] is False and m['finalHoldout']['derivativeRowsObservedAtFreeze'] is False
          assert m['signal']['entryAnnualizedTrailingFundingThreshold']==0.10 and m['signal']['exitAnnualizedTrailingFundingThreshold']==0.03
          assert m['portfolio']['futuresCollateralReservePctOfSleeveWhenActive']==0.80
          PY
          node --check research/crypto/source-qualified-diversified-regime-evaluate.js
          node --check research/crypto/source-qualified-diversified-regime-gate.js
          node --check research/crypto/risk-capped-funding-regime-evaluate.js
          python -m py_compile research/crypto/prepare-source-qualified-diversified-regime-window.py research/crypto/lib/carry_source_union.py
          python tests/test_prepare_carry_data.py
      - name: Acquire exact development sources
        run: |
          set -euo pipefail
          for pair in AVAXUSDT:avax DOTUSDT:dot ATOMUSDT:atom ETCUSDT:etc; do
            symbol=${pair%%:*}; prefix=${pair##*:}
            python research/crypto/prepare-source-qualified-diversified-regime-window.py research/crypto/manifests/source-qualified-diversified-regime-v1.json development "$symbol" "/tmp/t25-$prefix.csv" "/tmp/t25-$prefix-src.json"
          done
      - name: Verify development sources before economics
        run: |
          python - <<'PY'
          import json
          for s,p in [('AVAXUSDT','avax'),('DOTUSDT','dot'),('ATOMUSDT','atom'),('ETCUSDT','etc')]:
            x=json.load(open(f'/tmp/t25-{p}-src.json')); c=x['coverage']
            assert x['experimentId']=='source-qualified-diversified-regime-v1' and x['trialNumber']==25 and x['mode']=='development' and x['symbol']==s and x['economicResultCalculated'] is False
            assert c['expectedBoundaryRows']==c['synchronizedRows'] and c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - name: Observe frozen development once
        run: >-
          node research/crypto/source-qualified-diversified-regime-evaluate.js research/crypto/manifests/source-qualified-diversified-regime-v1.json development
          /tmp/t25-avax.csv /tmp/t25-dot.csv /tmp/t25-atom.csv /tmp/t25-etc.csv
          research/crypto/results/source-qualified-diversified-regime-v1-development/summary.json
      - name: Apply frozen development gate
        id: dev
        run: |
          set -euo pipefail
          node research/crypto/source-qualified-diversified-regime-gate.js research/crypto/manifests/source-qualified-diversified-regime-v1.json development research/crypto/results/source-qualified-diversified-regime-v1-development/summary.json /tmp/t25-avax-src.json /tmp/t25-dot-src.json /tmp/t25-atom-src.json /tmp/t25-etc-src.json research/crypto/results/source-qualified-diversified-regime-v1-development/gate.json
          cp /tmp/t25-*-src.json research/crypto/results/source-qualified-diversified-regime-v1-development/
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('pass=' + ('true' if json.load(open('research/crypto/results/source-qualified-diversified-regime-v1-development/gate.json'))['developmentGatePass'] else 'false'))
          PY
          git config user.name 'theoldtrader-research-bot'; git config user.email 'actions@users.noreply.github.com'
          git add research/crypto/results/source-qualified-diversified-regime-v1-development
          git commit -m 'Observe Trial 25 diversified regime development'
          git push origin HEAD:research/source-qualified-diversified-regime-v1
      - name: Acquire exact final sources
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          for pair in AVAXUSDT:avax DOTUSDT:dot ATOMUSDT:atom ETCUSDT:etc; do
            symbol=${pair%%:*}; prefix=${pair##*:}
            python research/crypto/prepare-source-qualified-diversified-regime-window.py research/crypto/manifests/source-qualified-diversified-regime-v1.json final "$symbol" "/tmp/t25-$prefix-final.csv" "/tmp/t25-$prefix-final-src.json" --confirm-final YES
          done
      - name: Verify final sources before economics
        if: steps.dev.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import json
          for s,p in [('AVAXUSDT','avax'),('DOTUSDT','dot'),('ATOMUSDT','atom'),('ETCUSDT','etc')]:
            x=json.load(open(f'/tmp/t25-{p}-final-src.json')); c=x['coverage']
            assert x['mode']=='final' and x['symbol']==s and x['economicResultCalculated'] is False
            assert c['expectedBoundaryRows']==c['synchronizedRows'] and c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - name: Observe frozen final once
        if: steps.dev.outputs.pass == 'true'
        run: >-
          node research/crypto/source-qualified-diversified-regime-evaluate.js research/crypto/manifests/source-qualified-diversified-regime-v1.json final
          /tmp/t25-avax-final.csv /tmp/t25-dot-final.csv /tmp/t25-atom-final.csv /tmp/t25-etc-final.csv
          research/crypto/results/source-qualified-diversified-regime-v1-final/summary.json --confirm-final YES
      - name: Apply frozen promotion gate and commit final evidence
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          node research/crypto/source-qualified-diversified-regime-gate.js research/crypto/manifests/source-qualified-diversified-regime-v1.json final research/crypto/results/source-qualified-diversified-regime-v1-final/summary.json /tmp/t25-avax-final-src.json /tmp/t25-dot-final-src.json /tmp/t25-atom-final-src.json /tmp/t25-etc-final-src.json research/crypto/results/source-qualified-diversified-regime-v1-final/promotion.json
          cp /tmp/t25-*-final-src.json research/crypto/results/source-qualified-diversified-regime-v1-final/
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.load(open('research/crypto/results/source-qualified-diversified-regime-v1-final/promotion.json'))
          if g.get('promotionEligible'):
            s=json.load(open('research/crypto/results/source-qualified-diversified-regime-v1-final/summary.json'))
            Path('research/crypto/results/source-qualified-diversified-regime-v1-final/PROMOTED.md').write_text('# Trial 25 paper-baseline promotion\n\nComplete pre-frozen one-shot final gate passed. Real-money trading remains forbidden.\n\nFinal net return: %.6f%%\n\nFinal Sharpe: %.4f\n\nFinal max drawdown: %.6f%%\n' % (100*s['basket']['netReturn'],s['basket']['sharpe'],100*s['basket']['maxDrawdown']))
          PY
          git pull --ff-only origin research/source-qualified-diversified-regime-v1
          git add research/crypto/results/source-qualified-diversified-regime-v1-final
          git commit -m 'Observe Trial 25 diversified regime final'
          git push origin HEAD:research/source-qualified-diversified-regime-v1
