name: Direct frozen Trial 33 second alt basket
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-trial33.yml']
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/proactive-alt-basket-b-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight frozen Trial 33
        run: |
          set -euo pipefail
          test ! -e research/crypto/results/proactive-alt-basket-b-v1-development/summary.json
          test ! -e research/crypto/results/proactive-alt-basket-b-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/proactive-alt-basket-b-v1.json'))
          assert m['trialNumber']==33 and m['status']=='FROZEN_PRE_DEVELOPMENT' and m['realMoneyAllowed'] is False
          assert m['assets']==['XRP','ADA','BNB','LTC']
          assert m['capital']['initialNotionalPctOfSleevePerLeg']==0.90
          assert m['multipleTesting']['trial32EconomicOutputObservedBeforeFreeze'] is False
          assert m['sourceQualification']['economicResultCalculated'] is False
          PY
          python -m py_compile research/crypto/trial33_alt_basket_b.py
      - name: Acquire development sources without economics
        run: |
          set -euo pipefail
          mkdir -p /tmp/t33-dev
          for c in XRP ADA BNB LTC; do
            lc=$(echo "$c" | tr '[:upper:]' '[:lower:]')
            python research/crypto/trial33_alt_basket_b.py prepare research/crypto/manifests/proactive-alt-basket-b-v1.json development "$c" "/tmp/t33-dev/${lc}.csv" "/tmp/t33-dev/${lc}-sources.json"
          done
      - name: Observe frozen development exactly once
        run: |
          set -euo pipefail
          python research/crypto/trial33_alt_basket_b.py evaluate research/crypto/manifests/proactive-alt-basket-b-v1.json development /tmp/t33-dev/xrp.csv,/tmp/t33-dev/ada.csv,/tmp/t33-dev/bnb.csv,/tmp/t33-dev/ltc.csv research/crypto/results/proactive-alt-basket-b-v1-development/summary.json
          python research/crypto/trial33_alt_basket_b.py gate research/crypto/manifests/proactive-alt-basket-b-v1.json development research/crypto/results/proactive-alt-basket-b-v1-development/summary.json research/crypto/results/proactive-alt-basket-b-v1-development/gate.json
          cp /tmp/t33-dev/*-sources.json research/crypto/results/proactive-alt-basket-b-v1-development/
      - name: Commit immutable development evidence
        id: dev
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/proactive-alt-basket-b-v1-development
          git commit -m 'Observe Trial 33 second alt-basket development'
          git pull --rebase origin research/proactive-alt-basket-b-v1
          git push origin HEAD:research/proactive-alt-basket-b-v1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('pass=' + ('true' if json.load(open('research/crypto/results/proactive-alt-basket-b-v1-development/gate.json'))['developmentGatePass'] else 'false'))
          PY
      - name: Acquire untouched final sources
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/t33-final
          for c in XRP ADA BNB LTC; do
            lc=$(echo "$c" | tr '[:upper:]' '[:lower:]')
            python research/crypto/trial33_alt_basket_b.py prepare research/crypto/manifests/proactive-alt-basket-b-v1.json final "$c" "/tmp/t33-final/${lc}.csv" "/tmp/t33-final/${lc}-sources.json"
          done
      - name: Observe one-shot frozen final
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          python research/crypto/trial33_alt_basket_b.py evaluate research/crypto/manifests/proactive-alt-basket-b-v1.json final /tmp/t33-final/xrp.csv,/tmp/t33-final/ada.csv,/tmp/t33-final/bnb.csv,/tmp/t33-final/ltc.csv research/crypto/results/proactive-alt-basket-b-v1-final/summary.json
          python research/crypto/trial33_alt_basket_b.py gate research/crypto/manifests/proactive-alt-basket-b-v1.json final research/crypto/results/proactive-alt-basket-b-v1-final/summary.json research/crypto/results/proactive-alt-basket-b-v1-final/gate.json
          cp /tmp/t33-final/*-sources.json research/crypto/results/proactive-alt-basket-b-v1-final/
      - name: Commit immutable final evidence
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/proactive-alt-basket-b-v1-final
          git commit -m 'Observe Trial 33 one-shot final'
          git pull --rebase origin research/proactive-alt-basket-b-v1
          git push origin HEAD:research/proactive-alt-basket-b-v1
