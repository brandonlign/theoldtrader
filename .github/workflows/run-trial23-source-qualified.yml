name: Execute frozen Trial 23 source-qualified carry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-trial23-source-qualified.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: trial23-source-qualified-carry
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/source-qualified-risk-capped-carry-v1, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight frozen Trial 23
        run: |
          set -euo pipefail
          test ! -e research/crypto/results/source-qualified-risk-capped-carry-v1-development/summary.json
          test ! -e research/crypto/results/source-qualified-risk-capped-carry-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/source-qualified-risk-capped-carry-v1.json'))
          assert m['experimentId']=='source-qualified-risk-capped-carry-v1' and m['trialNumber']==23 and m['status']=='FROZEN_PRE_DEVELOPMENT'
          assert m['assetSelection']['symbols']==['LINKUSDT','BCHUSDT']
          assert m['developmentWindow']['economicOutputObservedAtFreeze'] is False
          assert m['finalHoldout']['derivativeRowsObservedAtFreeze'] is False
          assert m['portfolio']['futuresCollateralReservePctOfSleeveWhenActive']==0.80
          assert m['signal']['entryAnnualizedTrailingFundingThreshold']==0.15
          assert m['signal']['exitAnnualizedTrailingFundingThreshold']==0.05
          assert m['riskControl']['maximumActiveBoundariesBeforeReanchor']==180
          assert m['riskControl']['maximumPerpetualMarkNotionalPctOfCurrentSleeveEquityBeforeReanchor']==0.25
          PY
          node --check research/crypto/source-qualified-risk-capped-evaluate.js
          node --check research/crypto/source-qualified-risk-capped-gate.js
          python -m py_compile research/crypto/prepare-source-qualified-risk-capped-window.py research/crypto/lib/carry_source_union.py
          python tests/test_prepare_carry_data.py
      - name: Acquire exact development sources
        run: |
          set -euo pipefail
          python research/crypto/prepare-source-qualified-risk-capped-window.py research/crypto/manifests/source-qualified-risk-capped-carry-v1.json development LINKUSDT /tmp/t23-link.csv /tmp/t23-link-src.json
          python research/crypto/prepare-source-qualified-risk-capped-window.py research/crypto/manifests/source-qualified-risk-capped-carry-v1.json development BCHUSDT /tmp/t23-bch.csv /tmp/t23-bch-src.json
      - name: Verify development sources before economics
        run: |
          python - <<'PY'
          import json
          for s,p in [('LINKUSDT','link'),('BCHUSDT','bch')]:
            x=json.load(open(f'/tmp/t23-{p}-src.json')); c=x['coverage']
            assert x['experimentId']=='source-qualified-risk-capped-carry-v1' and x['trialNumber']==23 and x['mode']=='development' and x['symbol']==s and x['economicResultCalculated'] is False
            assert c['expectedBoundaryRows']==c['synchronizedRows'] and c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - name: Observe frozen development once
        run: >-
          node research/crypto/source-qualified-risk-capped-evaluate.js
          research/crypto/manifests/source-qualified-risk-capped-carry-v1.json development
          /tmp/t23-link.csv /tmp/t23-bch.csv
          research/crypto/results/source-qualified-risk-capped-carry-v1-development/summary.json
      - name: Apply frozen development gate
        id: dev
        run: |
          set -euo pipefail
          node research/crypto/source-qualified-risk-capped-gate.js \
            research/crypto/manifests/source-qualified-risk-capped-carry-v1.json development \
            research/crypto/results/source-qualified-risk-capped-carry-v1-development/summary.json \
            /tmp/t23-link-src.json /tmp/t23-bch-src.json \
            research/crypto/results/source-qualified-risk-capped-carry-v1-development/gate.json
          cp /tmp/t23-link-src.json research/crypto/results/source-qualified-risk-capped-carry-v1-development/link-sources.json
          cp /tmp/t23-bch-src.json research/crypto/results/source-qualified-risk-capped-carry-v1-development/bch-sources.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('pass=' + ('true' if json.load(open('research/crypto/results/source-qualified-risk-capped-carry-v1-development/gate.json'))['developmentGatePass'] else 'false'))
          PY
          git config user.name 'theoldtrader-research-bot'; git config user.email 'actions@users.noreply.github.com'
          git add research/crypto/results/source-qualified-risk-capped-carry-v1-development
          git commit -m 'Observe Trial 23 source-qualified carry development'
          git push origin HEAD:research/source-qualified-risk-capped-carry-v1
      - name: Acquire exact final sources
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          python research/crypto/prepare-source-qualified-risk-capped-window.py research/crypto/manifests/source-qualified-risk-capped-carry-v1.json final LINKUSDT /tmp/t23-link-final.csv /tmp/t23-link-final-src.json --confirm-final YES
          python research/crypto/prepare-source-qualified-risk-capped-window.py research/crypto/manifests/source-qualified-risk-capped-carry-v1.json final BCHUSDT /tmp/t23-bch-final.csv /tmp/t23-bch-final-src.json --confirm-final YES
      - name: Verify final sources before economics
        if: steps.dev.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import json
          for s,p in [('LINKUSDT','link'),('BCHUSDT','bch')]:
            x=json.load(open(f'/tmp/t23-{p}-final-src.json')); c=x['coverage']
            assert x['mode']=='final' and x['symbol']==s and x['economicResultCalculated'] is False
            assert c['expectedBoundaryRows']==c['synchronizedRows'] and c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - name: Observe frozen final once
        if: steps.dev.outputs.pass == 'true'
        run: >-
          node research/crypto/source-qualified-risk-capped-evaluate.js
          research/crypto/manifests/source-qualified-risk-capped-carry-v1.json final
          /tmp/t23-link-final.csv /tmp/t23-bch-final.csv
          research/crypto/results/source-qualified-risk-capped-carry-v1-final/summary.json --confirm-final YES
      - name: Apply frozen promotion gate and commit final evidence
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          node research/crypto/source-qualified-risk-capped-gate.js \
            research/crypto/manifests/source-qualified-risk-capped-carry-v1.json final \
            research/crypto/results/source-qualified-risk-capped-carry-v1-final/summary.json \
            /tmp/t23-link-final-src.json /tmp/t23-bch-final-src.json \
            research/crypto/results/source-qualified-risk-capped-carry-v1-final/promotion.json
          cp /tmp/t23-link-final-src.json research/crypto/results/source-qualified-risk-capped-carry-v1-final/link-sources.json
          cp /tmp/t23-bch-final-src.json research/crypto/results/source-qualified-risk-capped-carry-v1-final/bch-sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.load(open('research/crypto/results/source-qualified-risk-capped-carry-v1-final/promotion.json'))
          if g.get('promotionEligible'):
            s=json.load(open('research/crypto/results/source-qualified-risk-capped-carry-v1-final/summary.json'))
            Path('research/crypto/results/source-qualified-risk-capped-carry-v1-final/PROMOTED.md').write_text('# Trial 23 paper-baseline promotion\n\nComplete pre-frozen one-shot final gate passed. Real-money trading remains forbidden.\n\nFinal net return: %.6f%%\n\nFinal Sharpe: %.4f\n\nFinal max drawdown: %.6f%%\n' % (100*s['basket']['netReturn'],s['basket']['sharpe'],100*s['basket']['maxDrawdown']))
          PY
          git pull --ff-only origin research/source-qualified-risk-capped-carry-v1
          git add research/crypto/results/source-qualified-risk-capped-carry-v1-final
          git commit -m 'Observe Trial 23 source-qualified carry final'
          git push origin HEAD:research/source-qualified-risk-capped-carry-v1
