name: TheOldTrader Cross-Sectional Trial 3 Final Holdout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-cross-sectional-v1-final
  cancel-in-progress: false

jobs:
  evaluate-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require frozen development result and pristine final slot
        shell: bash
        run: |
          set -euo pipefail
          test -f research/crypto/universes/cross-sectional-v1-universe.json
          test -f research/crypto/universes/cross-sectional-v1-formation-sources.json
          test -f research/crypto/results/cross-sectional-v1-development/summary.json
          test -f research/crypto/results/cross-sectional-v1-development/provenance.json
          test -f research/crypto/TRIAL3_IMPLEMENTATION_REVISION_3.md
          for path in \
            research/crypto/results/cross-sectional-v1-final/summary.json \
            research/crypto/results/cross-sectional-v1-final/provenance.json \
            research/crypto/results/cross-sectional-v1-final/promotion.json; do
            if [ -e "$path" ]; then
              echo "Final Trial 3 evidence already exists; refusing overwrite: $path" >&2
              exit 1
            fi
          done

      - name: Validate frozen implementation before first final access
        run: |
          npm ci
          npm test
          python -m py_compile research/crypto/prepare-cross-sectional-data.py
          python -m py_compile research/crypto/prepare-cross-sectional-development-data.py
          python -m py_compile research/crypto/prepare-cross-sectional-final-data.py
          python -m unittest tests/test_cross_sectional_universe.py tests/test_cross_sectional_development_wrapper.py

      - name: Acquire checksum-verified full dataset including sealed final holdout
        run: >-
          python research/crypto/prepare-cross-sectional-final-data.py
          research/crypto/manifests/cross-sectional-v1.json
          research/crypto/universes/cross-sectional-v1-universe.json
          /tmp/cross-sectional-v1-final.json.gz
          /tmp/cross-sectional-v1-final-sources.json

      - name: Verify frozen final boundaries and age provenance before economics
        run: |
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          start = int(datetime(2026, 1, 1, tzinfo=timezone.utc).timestamp())
          end = int(datetime(2026, 8, 1, tzinfo=timezone.utc).timestamp())
          with gzip.open('/tmp/cross-sectional-v1-final.json.gz', 'rt', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['endExclusive'] == '2026-08-01T00:00:00Z'
          assert len(data['firstObservedTimeBySymbol']) == 30
          assert all(symbol in data['firstObservedTimeBySymbol'] for symbol in data['universeMembership'])
          final_rows = [row for rows in data['products'].values() for row in rows if start <= row['time'] < end]
          assert final_rows, 'No final-holdout rows were acquired'
          assert all(row['time'] < end for rows in data['products'].values() for row in rows)
          print(f'Final holdout acquisition gate passed with {len(final_rows)} member-day rows and 30 age anchors.')
          PY

      - name: Evaluate final holdout exactly once
        run: >-
          node research/crypto/cross-sectional-evaluate.js
          --mode final
          --confirm-final YES
          --manifest research/crypto/manifests/cross-sectional-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --data /tmp/cross-sectional-v1-final.json.gz
          --out research/crypto/results/cross-sectional-v1-final/summary.json

      - name: Preserve compact final acquisition provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source_path = Path('/tmp/cross-sectional-v1-final-sources.json')
          sources = json.loads(source_path.read_text())
          out = Path('research/crypto/results/cross-sectional-v1-final/provenance.json')
          payload = {
              'experimentId': 'cross-sectional-v1',
              'mode': 'final',
              'finalHoldoutStart': '2026-01-01T00:00:00Z',
              'finalHoldoutEndExclusive': '2026-08-01T00:00:00Z',
              'datasetCanonicalJsonSha256': sources['datasetCanonicalJsonSha256'],
              'formationSourceManifestSha256': sources['formationSourceManifestSha256'],
              'universeMembershipSha256': sources['universeMembershipSha256'],
              'sourceArchiveCount': sources['sourceArchiveCount'],
              'firstObservationSourceCount': sources['firstObservationSourceCount'],
              'assetAgeSource': sources['assetAgeSource'],
              'sourceManifestSha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Apply frozen promotion criteria without changing live v2
        run: >-
          node research/crypto/cross-sectional-promotion-check.js
          --manifest research/crypto/manifests/cross-sectional-v1.json
          --development research/crypto/results/cross-sectional-v1-development/summary.json
          --final research/crypto/results/cross-sectional-v1-final/summary.json
          --out research/crypto/results/cross-sectional-v1-final/promotion.json

      - name: Commit immutable final evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/crypto/results/cross-sectional-v1-final/summary.json \
            research/crypto/results/cross-sectional-v1-final/provenance.json \
            research/crypto/results/cross-sectional-v1-final/promotion.json
          git commit -m 'Observe cross-sectional-v1 final holdout'
          git push origin HEAD:research/crypto-oos-v1

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-v1-final
          path: |
            research/crypto/results/cross-sectional-v1-final/summary.json
            research/crypto/results/cross-sectional-v1-final/provenance.json
            research/crypto/results/cross-sectional-v1-final/promotion.json
          if-no-files-found: error
