name: Trial 9 Public Connectivity

on:
  pull_request:
    paths:
      - "research/crypto/bitnomial-internal-carry-connectivity.mjs"
      - "research/crypto/lib/bitnomial-book.js"
      - "research/crypto/lib/bitnomial-internal-carry-identity.js"
      - "research/crypto/manifests/bitnomial-internal-carry-v1.json"
      - ".github/workflows/trial9-connectivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify no-secrets public REST and WebSocket path
        run: node research/crypto/bitnomial-internal-carry-connectivity.mjs
