name: Verify MoneyMog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run strategy tests
        run: npm test
      - name: Check Worker syntax
        run: >-
          node --check cloudflare/entry.js &&
          node --check cloudflare/worker.js &&
          node --check cloudflare/hosted-store.js &&
          node --check cloudflare/crypto-engine.js &&
          node --check cloudflare/crypto-store.js &&
          node --check src/crypto/coinbase-public.js &&
          node --check src/crypto/risk.js &&
          node --check src/crypto/strategy.js
      - name: Build dashboard
        run: npm run build
