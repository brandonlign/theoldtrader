name: Execute frozen Trial 19 funding regime carry

on:
  push:
    branches: [research/funding-regime-carry-v1]
    paths:
      - '.github/workflows/run-trial19-funding-regime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-trial19-funding-regime
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out frozen Trial 19 branch
        uses: actions/checkout@v4
        with:
          ref: research/funding-regime-carry-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require pristine frozen slots
        run: |
          set -euo pipefail
          test -f research/crypto/manifests/funding-regime-carry-v1.json
          test ! -e research/crypto/results/funding-regime-carry-v1-development/summary.json
          test ! -e research/crypto/results/funding-regime-carry-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/funding-regime-carry-v1.json'))
          assert m['experimentId']=='funding-regime-carry-v1' and m['trialNumber']==19
          assert m['status']=='FROZEN_PRE_DEVELOPMENT'
          assert m['assetSelection']['symbols']==['ADAUSDT','DOGEUSDT']
          assert m['assetSelection']['dataPreviouslyObservedAtFreeze']['fundingPerpetualExecutionMarkAndTrial19CarryEconomics'] is False
          assert m['developmentWindow']['derivativeRowsObservedAtFreeze'] is False
          assert m['finalHoldout']['derivativeRowsObservedAtFreeze'] is False
          assert m['signal']['lookbackFundingBoundaries']==90
          assert m['signal']['entryAnnualizedTrailingFundingThreshold']==0.20
          assert m['signal']['exitAnnualizedTrailingFundingThreshold']==0.08
          assert m['signal']['minimumStateBoundaries']==90
          PY

      - name: Validate implementation before derivative acquisition
        run: |
          set -euo pipefail
          npm install
          node --check research/crypto/funding-regime-carry-evaluate.js
          node --check research/crypto/funding-regime-carry-gate.js
          python -m py_compile research/crypto/prepare-funding-regime-carry-window.py
          node --test tests/funding-regime-carry.test.js
          node --test tests/crypto-carry-evaluate.test.js
          python -m unittest tests/test_prepare_carry_data.py

      - name: Acquire untouched ADA development derivative data
        run: python research/crypto/prepare-funding-regime-carry-window.py research/crypto/manifests/funding-regime-carry-v1.json development ADAUSDT /tmp/trial19-ada-dev.csv /tmp/trial19-ada-dev-sources.json

      - name: Acquire untouched DOGE development derivative data
        run: python research/crypto/prepare-funding-regime-carry-window.py research/crypto/manifests/funding-regime-carry-v1.json development DOGEUSDT /tmp/trial19-doge-dev.csv /tmp/trial19-doge-dev-sources.json

      - name: Verify exact development source coverage before economics
        run: |
          python - <<'PY'
          import json
          for symbol,prefix in [('ADAUSDT','ada'),('DOGEUSDT','doge')]:
              s=json.load(open(f'/tmp/trial19-{prefix}-dev-sources.json')); c=s['coverage']
              assert s['experimentId']=='funding-regime-carry-v1' and s['trialNumber']==19 and s['mode']=='development' and s['symbol']==symbol
              assert s['economicResultCalculated'] is False
              assert c['expectedBoundaryRows']==c['synchronizedRows']
              assert c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY

      - name: Observe frozen Trial 19 development once
        run: node research/crypto/funding-regime-carry-evaluate.js research/crypto/manifests/funding-regime-carry-v1.json development /tmp/trial19-ada-dev.csv /tmp/trial19-doge-dev.csv research/crypto/results/funding-regime-carry-v1-development/summary.json

      - name: Apply frozen Trial 19 development gate
        id: development_gate
        run: |
          node research/crypto/funding-regime-carry-gate.js research/crypto/manifests/funding-regime-carry-v1.json development research/crypto/results/funding-regime-carry-v1-development/summary.json /tmp/trial19-ada-dev-sources.json /tmp/trial19-doge-dev-sources.json research/crypto/results/funding-regime-carry-v1-development/gate.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          g=json.load(open('research/crypto/results/funding-regime-carry-v1-development/gate.json'))
          print('pass=' + ('true' if g['developmentGatePass'] else 'false'))
          PY

      - name: Preserve Trial 19 development provenance
        run: |
          cp /tmp/trial19-ada-dev-sources.json research/crypto/results/funding-regime-carry-v1-development/ada-sources.json
          cp /tmp/trial19-doge-dev-sources.json research/crypto/results/funding-regime-carry-v1-development/doge-sources.json

      - name: Commit immutable Trial 19 development evidence
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- research/crypto/results/funding-regime-carry-v1-development
          git commit -m 'Observe Trial 19 funding regime development'
          git push origin HEAD:research/funding-regime-carry-v1

      - name: Acquire untouched ADA final derivative data
        if: steps.development_gate.outputs.pass == 'true'
        run: python research/crypto/prepare-funding-regime-carry-window.py research/crypto/manifests/funding-regime-carry-v1.json final ADAUSDT /tmp/trial19-ada-final.csv /tmp/trial19-ada-final-sources.json --confirm-final YES

      - name: Acquire untouched DOGE final derivative data
        if: steps.development_gate.outputs.pass == 'true'
        run: python research/crypto/prepare-funding-regime-carry-window.py research/crypto/manifests/funding-regime-carry-v1.json final DOGEUSDT /tmp/trial19-doge-final.csv /tmp/trial19-doge-final-sources.json --confirm-final YES

      - name: Verify exact final source coverage before economics
        if: steps.development_gate.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import json
          for symbol,prefix in [('ADAUSDT','ada'),('DOGEUSDT','doge')]:
              s=json.load(open(f'/tmp/trial19-{prefix}-final-sources.json')); c=s['coverage']
              assert s['experimentId']=='funding-regime-carry-v1' and s['trialNumber']==19 and s['mode']=='final' and s['symbol']==symbol
              assert s['economicResultCalculated'] is False
              assert c['expectedBoundaryRows']==c['synchronizedRows']
              assert c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY

      - name: Observe frozen Trial 19 final once
        if: steps.development_gate.outputs.pass == 'true'
        run: node research/crypto/funding-regime-carry-evaluate.js research/crypto/manifests/funding-regime-carry-v1.json final /tmp/trial19-ada-final.csv /tmp/trial19-doge-final.csv research/crypto/results/funding-regime-carry-v1-final/summary.json --confirm-final YES

      - name: Apply frozen Trial 19 promotion gate
        if: steps.development_gate.outputs.pass == 'true'
        id: promotion_gate
        run: |
          node research/crypto/funding-regime-carry-gate.js research/crypto/manifests/funding-regime-carry-v1.json final research/crypto/results/funding-regime-carry-v1-final/summary.json /tmp/trial19-ada-final-sources.json /tmp/trial19-doge-final-sources.json research/crypto/results/funding-regime-carry-v1-final/promotion.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          g=json.load(open('research/crypto/results/funding-regime-carry-v1-final/promotion.json'))
          print('pass=' + ('true' if g['promotionEligible'] else 'false'))
          PY

      - name: Preserve Trial 19 final provenance
        if: steps.development_gate.outputs.pass == 'true'
        run: |
          cp /tmp/trial19-ada-final-sources.json research/crypto/results/funding-regime-carry-v1-final/ada-sources.json
          cp /tmp/trial19-doge-final-sources.json research/crypto/results/funding-regime-carry-v1-final/doge-sources.json

      - name: Write paper-baseline promotion marker
        if: steps.development_gate.outputs.pass == 'true' && steps.promotion_gate.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('research/crypto/results/funding-regime-carry-v1-final/summary.json'))
          p=Path('research/crypto/results/funding-regime-carry-v1-final/PROMOTED.md')
          p.write_text(
              '# Trial 19 paper-baseline promotion\n\n'
              'The pre-frozen Trial 19 final gate passed. This authorizes a paper-baseline promotion only; it does not authorize real-money trading.\n\n'
              f"Final net return: {s['basket']['netReturn']:.6%}\n\n"
              f"Final Sharpe: {s['basket']['sharpe']:.4f}\n\n"
              f"Final max drawdown: {s['basket']['maxDrawdown']:.6%}\n\n"
              f"Completed round trips: {s['completedRoundTrips']}\n"
          )
          PY

      - name: Commit immutable Trial 19 final evidence
        if: steps.development_gate.outputs.pass == 'true'
        run: |
          set -euo pipefail
          git pull --ff-only origin research/funding-regime-carry-v1
          git add -- research/crypto/results/funding-regime-carry-v1-final
          git commit -m 'Observe Trial 19 funding regime final'
          git push origin HEAD:research/funding-regime-carry-v1

      - name: Upload Trial 19 evidence
        uses: actions/upload-artifact@v4
        with:
          name: funding-regime-carry-v1-evidence
          path: |
            research/crypto/results/funding-regime-carry-v1-development
            research/crypto/results/funding-regime-carry-v1-final
          if-no-files-found: error
