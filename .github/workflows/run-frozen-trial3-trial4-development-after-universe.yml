name: Execute frozen Trial 3 and Trial 4 development after universe

on:
  workflow_run:
    workflows:
      - 'Execute frozen Trial 3 universe formation now'
      - 'TheOldTrader Cross-Sectional Trial 3 Universe Formation'
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-frozen-trial3-trial4-development-after-universe.yml'

permissions:
  contents: write

concurrency:
  group: execute-frozen-trial3-trial4-development
  cancel-in-progress: false

jobs:
  evaluate-development:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require immutable universe and pristine development slots
        run: |
          set -euo pipefail
          test -f research/crypto/universes/cross-sectional-v1-universe.json
          test -f research/crypto/universes/cross-sectional-v1-formation-sources.json
          test ! -e research/crypto/results/cross-sectional-v1-development/summary.json
          test ! -e research/crypto/results/ctrend-v1-development/summary.json

      - name: Validate frozen pre-result implementation
        run: |
          set -euo pipefail
          npm ci
          npm test
          python -m unittest tests/test_cross_sectional_universe.py
          node --check research/crypto/cross-sectional-evaluate.js
          node --check research/crypto/ctrend-evaluate-rest.js
          python -m py_compile research/crypto/prepare-cross-sectional-development-data.py
          python -m py_compile research/crypto/prepare-ctrend-rest-data.py
          python tests/test_prepare_ctrend_rest_data.py

      - name: Acquire Trial 3 development data only
        run: >-
          python research/crypto/prepare-cross-sectional-development-data.py
          research/crypto/manifests/cross-sectional-v1.json
          research/crypto/universes/cross-sectional-v1-universe.json
          /tmp/cross-sectional-v1-development.json.gz
          /tmp/cross-sectional-v1-development-sources.json

      - name: Verify Trial 3 final holdout is sealed
        run: |
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          boundary = int(datetime(2026, 1, 1, tzinfo=timezone.utc).timestamp())
          with gzip.open('/tmp/cross-sectional-v1-development.json.gz', 'rt', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['endExclusive'] == '2026-01-01T00:00:00Z'
          assert all(row['time'] < boundary for rows in data['products'].values() for row in rows)
          print('Trial 3 final holdout firewall verified.')
          PY

      - name: Observe frozen Trial 3 development result once
        run: >-
          node research/crypto/cross-sectional-evaluate.js
          --mode development
          --manifest research/crypto/manifests/cross-sectional-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --data /tmp/cross-sectional-v1-development.json.gz
          --out research/crypto/results/cross-sectional-v1-development/summary.json

      - name: Preserve Trial 3 provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source_path = Path('/tmp/cross-sectional-v1-development-sources.json')
          sources = json.loads(source_path.read_text())
          out = Path('research/crypto/results/cross-sectional-v1-development/provenance.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              'experimentId': 'cross-sectional-v1',
              'mode': 'development',
              'finalHoldoutRowsAcquired': 0,
              'datasetCanonicalJsonSha256': sources['datasetCanonicalJsonSha256'],
              'formationSourceManifestSha256': sources['formationSourceManifestSha256'],
              'universeMembershipSha256': sources['universeMembershipSha256'],
              'sourceArchiveCount': sources['sourceArchiveCount'],
              'sourceManifestSha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit immutable Trial 3 development evidence
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            research/crypto/results/cross-sectional-v1-development/summary.json \
            research/crypto/results/cross-sectional-v1-development/provenance.json
          git commit -m 'Observe cross-sectional-v1 development result'
          git push origin HEAD:research/crypto-oos-v1

      - name: Acquire Trial 4 official REST development data only
        run: >-
          python research/crypto/prepare-ctrend-rest-data.py
          --mode development
          --manifest research/crypto/manifests/ctrend-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --out /tmp/ctrend-v1-development.json.gz
          --sources /tmp/ctrend-v1-development-sources.json
          --raw-dir /tmp/ctrend-v1-development-pages

      - name: Verify Trial 4 final holdout is sealed
        run: |
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          boundary = int(datetime(2026, 1, 1, tzinfo=timezone.utc).timestamp())
          with gzip.open('/tmp/ctrend-v1-development.json.gz', 'rt', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['experimentId'] == 'ctrend-v1'
          assert data['acquisitionMode'] == 'development'
          assert data['sourceType'] == 'official Binance market-data-only REST /api/v3/klines'
          assert data['sourceBaseUrl'] == 'https://data-api.binance.vision'
          assert data['endExclusive'] == '2026-01-01T00:00:00Z'
          assert all(row['time'] < boundary for rows in data['products'].values() for row in rows)
          print('Trial 4 final holdout firewall verified.')
          PY

      - name: Observe frozen Trial 4 development result once
        run: >-
          node research/crypto/ctrend-evaluate-rest.js
          --mode development
          --manifest research/crypto/manifests/ctrend-v1.json
          --universe research/crypto/universes/cross-sectional-v1-universe.json
          --data /tmp/ctrend-v1-development.json.gz
          --out research/crypto/results/ctrend-v1-development/summary.json

      - name: Preserve Trial 4 provenance
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          source_path = Path('/tmp/ctrend-v1-development-sources.json')
          sources = json.loads(source_path.read_text())
          result_dir = Path('research/crypto/results/ctrend-v1-development')
          result_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source_path, result_dir / 'source-pages.json')
          payload = {
              'experimentId': 'ctrend-v1',
              'trialNumber': 4,
              'mode': 'development',
              'sourceType': sources['sourceType'],
              'sourceBaseUrl': sources['sourceBaseUrl'],
              'finalHoldoutRowsAcquired': 0,
              'datasetCanonicalJsonSha256': sources['datasetCanonicalJsonSha256'],
              'formationSourceManifestSha256': sources['formationSourceManifestSha256'],
              'universeMembershipSha256': sources['universeMembershipSha256'],
              'rawPageCount': sources['rawPageCount'],
              'sourceManifestSha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
          }
          (result_dir / 'provenance.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit immutable Trial 4 development evidence
        run: |
          set -euo pipefail
          git add -- \
            research/crypto/results/ctrend-v1-development/summary.json \
            research/crypto/results/ctrend-v1-development/provenance.json \
            research/crypto/results/ctrend-v1-development/source-pages.json
          git commit -m 'Observe ctrend-v1 development result'
          git push origin HEAD:research/crypto-oos-v1

      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: frozen-trial3-trial4-development
          path: |
            research/crypto/results/cross-sectional-v1-development
            research/crypto/results/ctrend-v1-development
            /tmp/ctrend-v1-development-pages
          if-no-files-found: error
