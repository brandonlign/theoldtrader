name: Direct frozen Trial 32 proactive alt basket
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-trial32.yml']
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/proactive-alt-basket-crossvenue-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight frozen Trial 32
        run: |
          set -euo pipefail
          test ! -e research/crypto/results/proactive-alt-basket-crossvenue-v1-development/summary.json
          test ! -e research/crypto/results/proactive-alt-basket-crossvenue-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json'))
          assert m['trialNumber']==32 and m['status']=='FROZEN_PRE_DEVELOPMENT' and m['realMoneyAllowed'] is False
          assert m['assets']==['SOL','DOGE','AVAX','LINK']
          assert m['capital']['initialNotionalPctOfSleevePerLeg']==0.90
          assert m['multipleTesting']['trial31EconomicOutputObservedBeforeFreeze'] is False
          PY
          python -m py_compile research/crypto/trial32_alt_basket.py
      - name: Acquire development sources without economics
        run: |
          set -euo pipefail
          mkdir -p /tmp/t32-dev
          for c in SOL DOGE AVAX LINK; do
            lc=$(echo "$c" | tr '[:upper:]' '[:lower:]')
            python research/crypto/trial32_alt_basket.py prepare research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json development "$c" "/tmp/t32-dev/${lc}.csv" "/tmp/t32-dev/${lc}-sources.json"
          done
      - name: Observe frozen development exactly once
        run: |
          set -euo pipefail
          python research/crypto/trial32_alt_basket.py evaluate research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json development /tmp/t32-dev/sol.csv,/tmp/t32-dev/doge.csv,/tmp/t32-dev/avax.csv,/tmp/t32-dev/link.csv research/crypto/results/proactive-alt-basket-crossvenue-v1-development/summary.json
          python research/crypto/trial32_alt_basket.py gate research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json development research/crypto/results/proactive-alt-basket-crossvenue-v1-development/summary.json research/crypto/results/proactive-alt-basket-crossvenue-v1-development/gate.json
          cp /tmp/t32-dev/*-sources.json research/crypto/results/proactive-alt-basket-crossvenue-v1-development/
      - name: Commit immutable development evidence
        id: dev
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/proactive-alt-basket-crossvenue-v1-development
          git commit -m 'Observe Trial 32 proactive alt-basket development'
          git pull --rebase origin research/proactive-alt-basket-crossvenue-v1
          git push origin HEAD:research/proactive-alt-basket-crossvenue-v1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('pass=' + ('true' if json.load(open('research/crypto/results/proactive-alt-basket-crossvenue-v1-development/gate.json'))['developmentGatePass'] else 'false'))
          PY
      - name: Acquire untouched final sources
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/t32-final
          for c in SOL DOGE AVAX LINK; do
            lc=$(echo "$c" | tr '[:upper:]' '[:lower:]')
            python research/crypto/trial32_alt_basket.py prepare research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json final "$c" "/tmp/t32-final/${lc}.csv" "/tmp/t32-final/${lc}-sources.json"
          done
      - name: Observe one-shot frozen final
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          python research/crypto/trial32_alt_basket.py evaluate research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json final /tmp/t32-final/sol.csv,/tmp/t32-final/doge.csv,/tmp/t32-final/avax.csv,/tmp/t32-final/link.csv research/crypto/results/proactive-alt-basket-crossvenue-v1-final/summary.json
          python research/crypto/trial32_alt_basket.py gate research/crypto/manifests/proactive-alt-basket-crossvenue-v1.json final research/crypto/results/proactive-alt-basket-crossvenue-v1-final/summary.json research/crypto/results/proactive-alt-basket-crossvenue-v1-final/gate.json
          cp /tmp/t32-final/*-sources.json research/crypto/results/proactive-alt-basket-crossvenue-v1-final/
      - name: Commit immutable final evidence
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/proactive-alt-basket-crossvenue-v1-final
          git commit -m 'Observe Trial 32 one-shot final'
          git pull --rebase origin research/proactive-alt-basket-crossvenue-v1
          git push origin HEAD:research/proactive-alt-basket-crossvenue-v1
