name: Run Frozen Trial 2 Carry Primary

on:
  pull_request:
    branches: [research/crypto-oos-v1]
    paths:
      - '.github/workflows/run-trial2-carry-primary.yml'

permissions:
  contents: read

concurrency:
  group: frozen-trial2-carry-primary
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out frozen Trial 2 branch, not PR merge code
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - name: Set up frozen-era Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse if primary result already exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f research/crypto/results/funding-carry-v1/summary.json ]; then
            echo 'Frozen Trial 2 primary result already exists; refusing overwrite.'
            exit 3
          fi

      - name: Static and deterministic frozen checks
        run: |
          python -m py_compile research/crypto/prepare-carry-data.py
          node --check research/crypto/carry-evaluate.js
          node --check research/crypto/carry-report.js
          python -m unittest tests/test_prepare_carry_data.py
          node --test tests/crypto-carry-evaluate.test.js

      - name: Download and checksum official Binance Vision archives
        id: acquire
        continue-on-error: true
        run: >-
          python research/crypto/prepare-carry-data.py
          research/crypto/manifests/funding-carry-v1.json
          research/crypto/data-cache/funding-carry-v1-synchronized.csv
          research/crypto/data-cache/funding-carry-v1-sources.json

      - name: Forensic audit of exact mark-price gaps only
        if: steps.acquire.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from datetime import datetime

          path = 'research/crypto/prepare-carry-data.py'
          spec = importlib.util.spec_from_file_location('carry_prepare', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          manifest = json.load(open('research/crypto/manifests/funding-carry-v1.json'))
          window = manifest['historicalRobustnessWindow']
          start_ms = int(datetime.fromisoformat(window['startInclusive'].replace('Z', '+00:00')).timestamp() * 1000)
          end_ms = int(datetime.fromisoformat(window['endExclusive'].replace('Z', '+00:00')).timestamp() * 1000)
          tolerance = int(manifest['dataRequirements']['fundingTimestampNormalization']['maximumAbsoluteSkewMs'])
          months = list(mod.month_range(start_ms, end_ms))
          marks, _ = mod.download_many('mark_monthly', months, start_ms, end_ms, tolerance)
          funding, _ = mod.download_many('funding_monthly', months, start_ms, end_ms, tolerance)
          funding_times = sorted(funding)
          mark_times = sorted(marks)
          missing = [t for t in funding_times if t not in marks]
          print(json.dumps({
            'forensicOnly': True,
            'economicsCalculated': False,
            'missingMarkCount': len(missing),
            'missingBoundaries': [mod.iso_ms(t) for t in missing],
            'nearestMarks': [
              {
                'boundary': mod.iso_ms(t),
                'previous': mod.iso_ms(max((m for m in mark_times if m < t), default=t)) if any(m < t for m in mark_times) else None,
                'next': mod.iso_ms(min((m for m in mark_times if m > t), default=t)) if any(m > t for m in mark_times) else None,
                'previousDeltaHours': ((t - max((m for m in mark_times if m < t), default=t)) / 3_600_000) if any(m < t for m in mark_times) else None,
                'nextDeltaHours': ((min((m for m in mark_times if m > t), default=t) - t) / 3_600_000) if any(m > t for m in mark_times) else None,
              }
              for t in missing
            ]
          }, indent=2))
          PY
          exit 1

      - name: Evaluate frozen Trial 2 exactly once in this run
        if: steps.acquire.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/crypto/results/funding-carry-v1
          node research/crypto/carry-evaluate.js \
            research/crypto/manifests/funding-carry-v1.json \
            research/crypto/data-cache/funding-carry-v1-synchronized.csv \
            > research/crypto/results/funding-carry-v1/summary.json
          node research/crypto/carry-report.js \
            research/crypto/results/funding-carry-v1/summary.json \
            research/crypto/results/funding-carry-v1

      - name: Upload immutable evidence bundle
        if: steps.acquire.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: funding-carry-v1-primary-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            research/crypto/manifests/funding-carry-v1.json
            research/crypto/data-cache/funding-carry-v1-synchronized.csv
            research/crypto/data-cache/funding-carry-v1-sources.json
            research/crypto/results/funding-carry-v1

# Orchestration only. This workflow deliberately checks out research/crypto-oos-v1,
# so PR branch contents cannot alter the frozen Trial 2 manifest/evaluator/data builder.
# The failure-only forensic step diagnoses source timestamp coverage and never computes economics.