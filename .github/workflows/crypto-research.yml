name: MoneyMog Crypto Research v1

on:
  push:
    branches: [research/crypto-oos-v1]
    paths:
      - 'research/crypto/run.js'
      - 'research/crypto/lib/**'
      - 'research/crypto/manifests/**'
      - 'research/crypto/LITERATURE.md'
      - 'tests/crypto-research.test.js'
      - '.github/workflows/crypto-research.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-research-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Run full deterministic test suite
        run: npm test

      - name: Syntax-check research runner
        run: >-
          node --check research/crypto/run.js &&
          node --check research/crypto/lib/core.js &&
          node --check research/crypto/lib/data.js &&
          node --check research/crypto/lib/report.js &&
          node --check research/crypto/lib/v2-backtest.js

      - name: Run frozen OOS evaluation
        run: node research/crypto/run.js research/crypto/manifests/crypto-oos-v1.json

      - name: Commit immutable data cache and result bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'moneymog-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/crypto/data-cache research/crypto/results
          if git diff --cached --quiet; then
            echo 'No new research evidence to commit.'
            exit 0
          fi
          git commit -m 'Record frozen crypto-oos-v1 evaluation'
          git push origin HEAD:research/crypto-oos-v1

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: crypto-oos-v1-evidence
          path: |
            research/crypto/results/crypto-oos-v1
            research/crypto/data-cache
          if-no-files-found: error
