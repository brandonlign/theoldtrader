name: Execute frozen Trial 22 risk-capped funding regime

on:
  push:
    branches: [research/risk-capped-funding-regime-v1]
    paths:
      - '.github/workflows/run-trial22-risk-capped-funding-regime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: execute-trial22-risk-capped-funding-regime
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/risk-capped-funding-regime-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require pristine frozen Trial 22 slots
        run: |
          set -euo pipefail
          test -f research/crypto/manifests/risk-capped-funding-regime-v1.json
          test ! -e research/crypto/results/risk-capped-funding-regime-v1-development/summary.json
          test ! -e research/crypto/results/risk-capped-funding-regime-v1-final/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/risk-capped-funding-regime-v1.json'))
          assert m['experimentId']=='risk-capped-funding-regime-v1' and m['trialNumber']==22
          assert m['status']=='FROZEN_PRE_DEVELOPMENT'
          assert m['assetSelection']['symbols']==['LINKUSDT','BCHUSDT','EOSUSDT','UNIUSDT']
          assert m['assetSelection']['dataPreviouslyObservedAtFreeze']['fundingPerpetualExecutionMarkAndTrial22CarryEconomics'] is False
          assert m['developmentWindow']['derivativeRowsObservedAtFreeze'] is False
          assert m['finalHoldout']['derivativeRowsObservedAtFreeze'] is False
          assert m['portfolio']['futuresCollateralReservePctOfSleeveWhenActive']==0.80
          assert m['riskControl']['maximumActiveBoundariesBeforeReanchor']==180
          assert m['riskControl']['maximumPerpetualMarkNotionalPctOfCurrentSleeveEquityBeforeReanchor']==0.25
          assert m['signal']['entryAnnualizedTrailingFundingThreshold']==0.15
          assert m['signal']['exitAnnualizedTrailingFundingThreshold']==0.05
          PY
      - name: Validate implementation before real derivative acquisition
        run: |
          set -euo pipefail
          node --check research/crypto/risk-capped-funding-regime-evaluate.js
          node --check research/crypto/risk-capped-funding-regime-gate.js
          python -m py_compile research/crypto/prepare-risk-capped-funding-regime-window.py
          node --test tests/risk-capped-funding-regime.test.js
          python -m unittest tests/test_carry_source_union.py

  acquire_development:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: LINKUSDT
            prefix: link
          - symbol: BCHUSDT
            prefix: bch
          - symbol: EOSUSDT
            prefix: eos
          - symbol: UNIUSDT
            prefix: uni
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/risk-capped-funding-regime-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Acquire untouched development derivative data
        run: >-
          python research/crypto/prepare-risk-capped-funding-regime-window.py
          research/crypto/manifests/risk-capped-funding-regime-v1.json development ${{ matrix.symbol }}
          trial22-${{ matrix.prefix }}-dev.csv trial22-${{ matrix.prefix }}-dev-sources.json
      - name: Verify exact source-union coverage before economics
        env:
          SRC: trial22-${{ matrix.prefix }}-dev-sources.json
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open(os.environ['SRC'])); c=s['coverage']
          assert s['experimentId']=='risk-capped-funding-regime-v1' and s['trialNumber']==22 and s['mode']=='development' and s['symbol']==os.environ['SYMBOL']
          assert s['economicResultCalculated'] is False
          assert c['expectedBoundaryRows']==c['synchronizedRows']
          assert c['overlapMismatchCount']==0 and c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trial22-dev-${{ matrix.prefix }}
          path: |
            trial22-${{ matrix.prefix }}-dev.csv
            trial22-${{ matrix.prefix }}-dev-sources.json
          if-no-files-found: error

  evaluate_development:
    needs: acquire_development
    runs-on: ubuntu-latest
    outputs:
      gate_pass: ${{ steps.read_gate.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/risk-capped-funding-regime-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/download-artifact@v4
        with: {name: trial22-dev-link, path: trial22-dev}
      - uses: actions/download-artifact@v4
        with: {name: trial22-dev-bch, path: trial22-dev}
      - uses: actions/download-artifact@v4
        with: {name: trial22-dev-eos, path: trial22-dev}
      - uses: actions/download-artifact@v4
        with: {name: trial22-dev-uni, path: trial22-dev}
      - name: Observe frozen Trial 22 development once
        run: >-
          node research/crypto/risk-capped-funding-regime-evaluate.js
          research/crypto/manifests/risk-capped-funding-regime-v1.json development
          trial22-dev/trial22-link-dev.csv trial22-dev/trial22-bch-dev.csv
          trial22-dev/trial22-eos-dev.csv trial22-dev/trial22-uni-dev.csv
          research/crypto/results/risk-capped-funding-regime-v1-development/summary.json
      - name: Apply frozen Trial 22 development gate
        run: >-
          node research/crypto/risk-capped-funding-regime-gate.js
          research/crypto/manifests/risk-capped-funding-regime-v1.json development
          research/crypto/results/risk-capped-funding-regime-v1-development/summary.json
          trial22-dev/trial22-link-dev-sources.json trial22-dev/trial22-bch-dev-sources.json
          trial22-dev/trial22-eos-dev-sources.json trial22-dev/trial22-uni-dev-sources.json
          research/crypto/results/risk-capped-funding-regime-v1-development/gate.json
      - name: Preserve development provenance
        run: |
          cp trial22-dev/trial22-link-dev-sources.json research/crypto/results/risk-capped-funding-regime-v1-development/link-sources.json
          cp trial22-dev/trial22-bch-dev-sources.json research/crypto/results/risk-capped-funding-regime-v1-development/bch-sources.json
          cp trial22-dev/trial22-eos-dev-sources.json research/crypto/results/risk-capped-funding-regime-v1-development/eos-sources.json
          cp trial22-dev/trial22-uni-dev-sources.json research/crypto/results/risk-capped-funding-regime-v1-development/uni-sources.json
      - name: Read development gate
        id: read_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          g=json.load(open('research/crypto/results/risk-capped-funding-regime-v1-development/gate.json'))
          print('pass=' + ('true' if g['developmentGatePass'] else 'false'))
          PY
      - name: Commit immutable development evidence
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- research/crypto/results/risk-capped-funding-regime-v1-development
          git commit -m 'Observe Trial 22 risk-capped funding development'
          git push origin HEAD:research/risk-capped-funding-regime-v1
      - uses: actions/upload-artifact@v4
        with:
          name: trial22-development-evidence
          path: research/crypto/results/risk-capped-funding-regime-v1-development
          if-no-files-found: error

  acquire_final:
    needs: evaluate_development
    if: needs.evaluate_development.outputs.gate_pass == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: LINKUSDT
            prefix: link
          - symbol: BCHUSDT
            prefix: bch
          - symbol: EOSUSDT
            prefix: eos
          - symbol: UNIUSDT
            prefix: uni
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/risk-capped-funding-regime-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Acquire untouched one-shot final derivative data
        run: >-
          python research/crypto/prepare-risk-capped-funding-regime-window.py
          research/crypto/manifests/risk-capped-funding-regime-v1.json final ${{ matrix.symbol }}
          trial22-${{ matrix.prefix }}-final.csv trial22-${{ matrix.prefix }}-final-sources.json
          --confirm-final YES
      - uses: actions/upload-artifact@v4
        with:
          name: trial22-final-${{ matrix.prefix }}
          path: |
            trial22-${{ matrix.prefix }}-final.csv
            trial22-${{ matrix.prefix }}-final-sources.json
          if-no-files-found: error

  evaluate_final:
    needs: [evaluate_development, acquire_final]
    if: needs.evaluate_development.outputs.gate_pass == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/risk-capped-funding-regime-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/download-artifact@v4
        with: {name: trial22-final-link, path: trial22-final}
      - uses: actions/download-artifact@v4
        with: {name: trial22-final-bch, path: trial22-final}
      - uses: actions/download-artifact@v4
        with: {name: trial22-final-eos, path: trial22-final}
      - uses: actions/download-artifact@v4
        with: {name: trial22-final-uni, path: trial22-final}
      - name: Verify exact final coverage before economics
        run: |
          python - <<'PY'
          import json
          for symbol,prefix in [('LINKUSDT','link'),('BCHUSDT','bch'),('EOSUSDT','eos'),('UNIUSDT','uni')]:
              s=json.load(open(f'trial22-final/trial22-{prefix}-final-sources.json')); c=s['coverage']
              assert s['experimentId']=='risk-capped-funding-regime-v1' and s['trialNumber']==22 and s['mode']=='final' and s['symbol']==symbol
              assert s['economicResultCalculated'] is False
              assert c['expectedBoundaryRows']==c['synchronizedRows'] and c['overlapMismatchCount']==0
              assert c['missingSpotRows']==0 and c['missingPerpRows']==0 and c['missingMarkRows']==0
          PY
      - name: Observe frozen Trial 22 final once
        run: >-
          node research/crypto/risk-capped-funding-regime-evaluate.js
          research/crypto/manifests/risk-capped-funding-regime-v1.json final
          trial22-final/trial22-link-final.csv trial22-final/trial22-bch-final.csv
          trial22-final/trial22-eos-final.csv trial22-final/trial22-uni-final.csv
          research/crypto/results/risk-capped-funding-regime-v1-final/summary.json
          --confirm-final YES
      - name: Apply frozen Trial 22 promotion gate
        run: >-
          node research/crypto/risk-capped-funding-regime-gate.js
          research/crypto/manifests/risk-capped-funding-regime-v1.json final
          research/crypto/results/risk-capped-funding-regime-v1-final/summary.json
          trial22-final/trial22-link-final-sources.json trial22-final/trial22-bch-final-sources.json
          trial22-final/trial22-eos-final-sources.json trial22-final/trial22-uni-final-sources.json
          research/crypto/results/risk-capped-funding-regime-v1-final/promotion.json
      - name: Preserve final provenance and promotion marker
        run: |
          cp trial22-final/trial22-link-final-sources.json research/crypto/results/risk-capped-funding-regime-v1-final/link-sources.json
          cp trial22-final/trial22-bch-final-sources.json research/crypto/results/risk-capped-funding-regime-v1-final/bch-sources.json
          cp trial22-final/trial22-eos-final-sources.json research/crypto/results/risk-capped-funding-regime-v1-final/eos-sources.json
          cp trial22-final/trial22-uni-final-sources.json research/crypto/results/risk-capped-funding-regime-v1-final/uni-sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.load(open('research/crypto/results/risk-capped-funding-regime-v1-final/promotion.json'))
          if g.get('promotionEligible'):
              s=json.load(open('research/crypto/results/risk-capped-funding-regime-v1-final/summary.json'))
              Path('research/crypto/results/risk-capped-funding-regime-v1-final/PROMOTED.md').write_text(
                  '# Trial 22 paper-baseline promotion\n\n'
                  'The complete pre-frozen Trial 22 one-shot final gate passed. This authorizes a paper-baseline promotion only; real-money trading remains forbidden.\n\n'
                  f"Final net return: {s['basket']['netReturn']:.6%}\n\n"
                  f"Final Sharpe: {s['basket']['sharpe']:.4f}\n\n"
                  f"Final max drawdown: {s['basket']['maxDrawdown']:.6%}\n\n"
                  f"Completed round trips: {s['completedRoundTrips']}\n"
              )
          PY
      - name: Commit immutable final evidence
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --ff-only origin research/risk-capped-funding-regime-v1
          git add -- research/crypto/results/risk-capped-funding-regime-v1-final
          git commit -m 'Observe Trial 22 risk-capped funding final'
          git push origin HEAD:research/risk-capped-funding-regime-v1
      - uses: actions/upload-artifact@v4
        with:
          name: trial22-final-evidence
          path: research/crypto/results/risk-capped-funding-regime-v1-final
          if-no-files-found: error
