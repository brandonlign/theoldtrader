# trigger Trial 23 watcher
name: Watch running Trials 20 22 and 23
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/watch-running-trials20-22.yml']
permissions:
  actions: read
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Watch latest Trial 20 22 and 23 executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for workflow in recover-trial20-venue-native.yml run-trial22-now.yml run-trial23-source-qualified.yml; do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            echo "$workflow latest run: $id"
            if [ "$id" != 0 ]; then
              gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 10 || true
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --log || true
            fi
          done
