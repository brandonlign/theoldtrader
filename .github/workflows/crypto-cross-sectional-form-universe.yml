name: TheOldTrader Cross-Sectional Trial 3 Universe Formation

on:
  workflow_dispatch:
  push:
    branches: [research/crypto-oos-v1]
    paths:
      - '.github/workflows/crypto-cross-sectional-form-universe.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/crypto-cross-sectional-form-universe.yml'

permissions:
  contents: write

concurrency:
  group: crypto-cross-sectional-v1-universe
  cancel-in-progress: false

jobs:
  form-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4
        with:
          ref: research/crypto-oos-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to overwrite an existing frozen universe
        shell: bash
        run: |
          set -euo pipefail
          if [ -e research/crypto/universes/cross-sectional-v1-universe.json ] || \
             [ -e research/crypto/universes/cross-sectional-v1-formation-sources.json ]; then
            echo 'Trial 3 universe has already been formed; refusing to rerun formation.' >&2
            exit 1
          fi

      - name: Validate formation code and firewall tests
        run: |
          python -m py_compile research/crypto/form-cross-sectional-universe.py
          python -m py_compile research/crypto/form-cross-sectional-universe-entry.py
          python -m unittest tests/test_cross_sectional_universe.py

      - name: Form universe from checksum-verified 2022 data only
        run: >-
          python research/crypto/form-cross-sectional-universe-entry.py
          research/crypto/manifests/cross-sectional-v1.json
          research/crypto/universes/cross-sectional-v1-universe.json
          research/crypto/universes/cross-sectional-v1-formation-sources.json

      - name: Verify output explicitly says no post-formation data was inspected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/crypto/universes/cross-sectional-v1-universe.json')
          u = json.loads(p.read_text())
          assert u['status'] == 'UNIVERSE_FORMED_PRE_DEVELOPMENT'
          assert u['formationInformationEndExclusive'] == '2023-01-01T00:00:00Z'
          assert u['postFormationDataInspected'] is False
          assert len(u['membership']) == 30
          assert len(set(u['membership'])) == 30
          print('Trial 3 universe firewall verified.')
          PY

      - name: Commit immutable formation evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'theoldtrader-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            research/crypto/universes/cross-sectional-v1-universe.json \
            research/crypto/universes/cross-sectional-v1-formation-sources.json
          git commit -m 'Freeze cross-sectional-v1 2022 liquidity universe'
          git push origin HEAD:research/crypto-oos-v1

      - name: Upload universe formation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-v1-universe-formation
          path: |
            research/crypto/universes/cross-sectional-v1-universe.json
            research/crypto/universes/cross-sectional-v1-formation-sources.json
          if-no-files-found: error

# Re-triggered after restoring the frozen builder and aligning its existing
# compatibility shim with the deterministic unit test; no universe/result observed.
