name: Execute frozen Trial 29 once
on:
  push:
    branches: [research/threshold-collateral-crossvenue-v1]
    paths: ['.github/workflows/run-trial29-once.yml']
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/threshold-collateral-crossvenue-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          set -euo pipefail
          test ! -e research/crypto/results/threshold-collateral-crossvenue-v1-development/summary.json
          python - <<'PY'
          import json
          m=json.load(open('research/crypto/manifests/threshold-collateral-crossvenue-v1.json'))
          assert m['trialNumber']==29 and m['status']=='FROZEN_PRE_DEVELOPMENT' and m['realMoneyAllowed'] is False
          assert m['multipleTesting']['trial28EconomicOutputObservedBeforeFreeze'] is False
          PY
          python -m py_compile research/crypto/trial29_threshold_collateral.py
      - name: Acquire development without economics
        run: |
          set -euo pipefail
          mkdir -p /tmp/t29-dev
          python research/crypto/trial29_threshold_collateral.py prepare research/crypto/manifests/threshold-collateral-crossvenue-v1.json development BTC /tmp/t29-dev/btc.csv /tmp/t29-dev/btc-sources.json
          python research/crypto/trial29_threshold_collateral.py prepare research/crypto/manifests/threshold-collateral-crossvenue-v1.json development ETH /tmp/t29-dev/eth.csv /tmp/t29-dev/eth-sources.json
      - name: Evaluate development
        run: |
          set -euo pipefail
          python research/crypto/trial29_threshold_collateral.py evaluate research/crypto/manifests/threshold-collateral-crossvenue-v1.json development /tmp/t29-dev/btc.csv,/tmp/t29-dev/eth.csv research/crypto/results/threshold-collateral-crossvenue-v1-development/summary.json
          python research/crypto/trial29_threshold_collateral.py gate research/crypto/manifests/threshold-collateral-crossvenue-v1.json development research/crypto/results/threshold-collateral-crossvenue-v1-development/summary.json research/crypto/results/threshold-collateral-crossvenue-v1-development/gate.json
          cp /tmp/t29-dev/*-sources.json research/crypto/results/threshold-collateral-crossvenue-v1-development/
      - name: Commit development
        id: dev
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/threshold-collateral-crossvenue-v1-development
          git commit -m 'Observe Trial 29 threshold-collateral development'
          git pull --rebase origin research/threshold-collateral-crossvenue-v1
          git push origin HEAD:research/threshold-collateral-crossvenue-v1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('pass=' + ('true' if json.load(open('research/crypto/results/threshold-collateral-crossvenue-v1-development/gate.json'))['developmentGatePass'] else 'false'))
          PY
      - name: Acquire untouched final
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/t29-final
          python research/crypto/trial29_threshold_collateral.py prepare research/crypto/manifests/threshold-collateral-crossvenue-v1.json final BTC /tmp/t29-final/btc.csv /tmp/t29-final/btc-sources.json
          python research/crypto/trial29_threshold_collateral.py prepare research/crypto/manifests/threshold-collateral-crossvenue-v1.json final ETH /tmp/t29-final/eth.csv /tmp/t29-final/eth-sources.json
      - name: Evaluate one-shot final
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          python research/crypto/trial29_threshold_collateral.py evaluate research/crypto/manifests/threshold-collateral-crossvenue-v1.json final /tmp/t29-final/btc.csv,/tmp/t29-final/eth.csv research/crypto/results/threshold-collateral-crossvenue-v1-final/summary.json
          python research/crypto/trial29_threshold_collateral.py gate research/crypto/manifests/threshold-collateral-crossvenue-v1.json final research/crypto/results/threshold-collateral-crossvenue-v1-final/summary.json research/crypto/results/threshold-collateral-crossvenue-v1-final/gate.json
          cp /tmp/t29-final/*-sources.json research/crypto/results/threshold-collateral-crossvenue-v1-final/
      - name: Commit final
        if: steps.dev.outputs.pass == 'true'
        run: |
          set -euo pipefail
          git config user.name theoldtrader-research-bot
          git config user.email actions@users.noreply.github.com
          git add research/crypto/results/threshold-collateral-crossvenue-v1-final
          git commit -m 'Observe Trial 29 one-shot final'
          git pull --rebase origin research/threshold-collateral-crossvenue-v1
          git push origin HEAD:research/threshold-collateral-crossvenue-v1
